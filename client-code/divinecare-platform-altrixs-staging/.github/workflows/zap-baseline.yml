name: OWASP ZAP baseline (staging)

# Passive, unauthenticated baseline scan of the public staging site.
# The baseline scan spiders for a short time and only runs passive rules:
# it does not attack the target, submit forms, or log in.
on:
  schedule:
    - cron: '41 8 * * 2' # Tuesdays 08:41 UTC
  workflow_dispatch:
    inputs:
      target:
        description: URL to scan
        required: false
        default: https://staging.altrixs.com

permissions:
  contents: read

jobs:
  zap-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ github.event.inputs.target || 'https://staging.altrixs.com' }}
          rules_file_name: .zap/rules.tsv
          cmd_options: '-a -j'
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-baseline-report
